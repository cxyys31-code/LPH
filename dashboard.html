<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<script>
if(!localStorage.getItem("login")){
  window.location.href = "index.html";
}
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
}

/* BACKGROUND */
.bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-image:url("bg.png");
  background-size:cover;
  background-position:center bottom;
  opacity:0.25;
  z-index:-2;
}

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  opacity:0.6;
  z-index:-1;
}

/* BANNER */
.banner{
  background:#000;
  display:flex;
  align-items:center;
  padding:15px 20px;
}

.logo{
  width:45px;
  height:45px;
  margin-right:12px;
}

.text-group{
  display:flex;
  flex-direction:column;
}

.title{
  font-size:16px;
  font-weight:600;
  color:#fff;
  white-space:nowrap;
}

.subtitle{
  font-size:12px;
  color:#facc15;
  margin-top:6px;
}

/* ===== PENGUMUMAN ===== */
.pengumuman{
  width:100%;
  overflow:hidden;
  cursor:pointer;
  margin-top:10px;
}

/* isi berjalan */
.marquee{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  padding-left:100%;
  animation:jalan 12s linear infinite;
}

/* teks */
.marquee span{
  color:orange;
  font-weight:bold;
  font-size:13px;
}

/* icon speaker */
.icon{
  width:16px;
  height:16px;
  fill:orange;
  animation:getar 0.6s infinite;
}

/* animasi jalan */
@keyframes jalan{
  0%   { transform: translateX(0); }
  100% { transform: translateX(-200%); }
}

/* animasi getar speaker */
@keyframes getar{
  0%   { transform: translateX(0); }
  25%  { transform: translateX(1px); }
  50%  { transform: translateX(-1px); }
  75%  { transform: translateX(1px); }
  100% { transform: translateX(0); }
}

/* TEXT */
.welcome{
  margin-top:20px;
  font-size:22px;
  font-weight:bold;
}

.profile{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:10px auto;
  cursor:pointer;
  border:1px solid #ccc;
  background-image:url("JessePinkman.png");
  background-size:cover;
  background-position:center;
}

.name{
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
}

/* GRID */
.container{
  display:grid;
  grid-template-columns:repeat(3,90px);
  gap:20px;
  justify-content:center;
  margin-top:20px;
}

.item{
  cursor:pointer;
}

.card{
  width:90px;
  height:70px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.label{
  margin-top:6px;
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
}
</style>
</head>

<body>

<!-- Background -->
<div class="bg"></div>
<div class="overlay"></div>

<!-- Banner -->
<div class="banner">
    <img src="logo.png" class="logo">
    <div class="text-group">
        <div class="title">Universitas Musamus Merauke</div>
        <div class="subtitle"></div>
    </div>
</div>

<!-- Pengumuman -->
<div class="pengumuman" onclick="go('pengumuman.html')">
  <div class="marquee">
    
    <!-- Speaker Icon -->
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M3 10v4h4l5 4V6L7 10H3z"></path>
      <path d="M16 7c1.5 1.5 1.5 8.5 0 10"></path>
    </svg>

    <span>PENGUMUMAN!</span>

  </div>
</div>

<div class="welcome">SELAMAT DATANG</div>

<div class="profile" onclick="go('profile.html')"></div>

<div class="name">JESSE PINKMAN</div>

<div class="container">

  <div class="item" onclick="go('dosen.html')">
    <div class="card"><img src="dosen.png"></div>
    <div class="label">Dosen PA</div>
  </div>

  <div class="item" onclick="go('akademik.html')">
    <div class="card"><img src="akademik.png"></div>
    <div class="label">Akademik</div>
  </div>

  <div class="item" onclick="go('pembayaran.html')">
    <div class="card"><img src="pembayaran.png"></div>
    <div class="label">Pembayaran</div>
  </div>

  <div class="item" onclick="go('krs.html')">
    <div class="card"><img src="krs.png"></div>
    <div class="label">KRS</div>
  </div>

  <div class="item" onclick="go('khs.html')">
    <div class="card"><img src="khs.png"></div>
    <div class="label">KHS</div>
  </div>

  <div class="item" onclick="go('jadwal.html')">
    <div class="card"><img src="jadwal.png"></div>
    <div class="label">Jadwal</div>
  </div>

  <div class="item" onclick="go('vc.html')">
    <div class="card"><img src="vc.png"></div>
    <div class="label">Virtual Class</div>
  </div>

  <div class="item" onclick="go('fs.html')">
    <div class="card"><img src="fs.png"></div>
    <div class="label">File Sharing</div>
  </div>

  <div class="item" onclick="go('ipk.html')">
    <div class="card"><img src="ipk.png"></div>
    <div class="label">IP Komulatif</div>
  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<script>
if(!localStorage.getItem("login")){
  window.location.href = "index.html";
}
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:white;
  text-align:center;
}

/* BANNER */
.banner{
  width:100%;
  background: linear-gradient(90deg, orange, darkorange);
  color:white;
  padding:6px 0;
  overflow:hidden;
  cursor:pointer;
  font-size:13px;
}

.banner span{
  display:inline-block;
  white-space:nowrap;
  animation: jalan 10s linear infinite;
}

@keyframes jalan{
  from{ transform:translateX(100%); }
  to{ transform:translateX(-100%); }
}

/* TEXT */
.welcome{
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

/* PROFILE */
.profile{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:10px auto;
  cursor:pointer;
  border:1px solid #ccc;
  background-image:url("JessePinkman.png");
  background-size:cover;
  background-position:center;
}

/* NAME */
.name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:20px;
}

/* GRID */
.container{
  display:grid;
  grid-template-columns:repeat(3,90px);
  gap:20px;
  justify-content:center;
}

/* ITEM */
.item{
  cursor:pointer;
}

/* CARD */
.card{
  width:90px;
  height:70px;
  background:#f5f5f5;
  border:1px solid #ccc;
  border-radius:12px;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:0.2s;
}

.card:hover{
  transform:scale(1.05);
}

/* IMAGE AUTO FIT */
.card img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* TEXT */
.label{
  margin-top:5px;
  font-size:11px;
}
</style>
</head>

<body>

<div class="banner" onclick="go('pengumuman.html')">
  <span>PENGUMUMAN!!!</span>
</div>

<div class="welcome">SELAMAT DATANG</div>

<div class="profile" onclick="go('profil.html')"></div>

<div class="name">JESSE PINKMAN</div>

<div class="container">

  <div class="item" onclick="go('dosen.html')">
    <div class="card"><img src="dosen.png"></div>
    <div class="label">Dosen PA</div>
  </div>

  <div class="item" onclick="go('akademik.html')">
    <div class="card"><img src="akademik.png"></div>
    <div class="label">Akademik</div>
  </div>

  <div class="item" onclick="go('pembayaran.html')">
    <div class="card"><img src="pembayaran.png"></div>
    <div class="label">Pembayaran</div>
  </div>

  <div class="item" onclick="go('krs.html')">
    <div class="card"><img src="krs.png"></div>
    <div class="label">KRS</div>
  </div>

  <div class="item" onclick="go('khs.html')">
    <div class="card"><img src="khs.png"></div>
    <div class="label">KHS</div>
  </div>

  <div class="item" onclick="go('jadwal.html')">
    <div class="card"><img src="jadwal.png"></div>
    <div class="label">Jadwal</div>
  </div>

  <div class="item" onclick="go('vc.html')">
    <div class="card"><img src="vc.png"></div>
    <div class="label">Virtual Class</div>
  </div>

  <div class="item" onclick="go('fs.html')">
    <div class="card"><img src="fs.png"></div>
    <div class="label">File Sharing</div>
  </div>

  <div class="item" onclick="go('ipk.html')">
    <div class="card"><img src="ipk.png"></div>
    <div class="label">IP komulatif</div>
  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
